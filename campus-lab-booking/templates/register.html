
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration | Campus Lab Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Create Your Student Account</h1>
        <p>Register with your official VIT student email address.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p role="alert">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name" type="text"
                   maxlength="100" autocomplete="name" required>

            <label for="college_id">College ID</label>
            <input id="college_id" name="college_id" type="text"
                   maxlength="50" required>

            <label for="email">VIT student email</label>
            <input id="email" name="email" type="email"
                   placeholder="yourname@vitstudent.ac.in"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password"
                   type="password" minlength="8"
                   autocomplete="new-password" required>

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered? <a href="{{ url_for('home') }}">Log in</a></p>
    </main>
</body>
</html>
